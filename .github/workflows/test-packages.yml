name: Test packages

on:
  workflow_dispatch:
  push:
    branches: [build/test-packages]

permissions:
  contents: read

concurrency:
  group: test-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the Rust xcframework
        run: bash scripts/build-xcframework.sh

      - name: Archive and package the app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          ARCHIVE="$RUNNER_TEMP/Punktfunk-macos.xcarchive"
          DERIVED="$RUNNER_TEMP/DerivedData"

          xcodebuild archive \
            -project clients/apple/Punktfunk.xcodeproj \
            -scheme Punktfunk \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            -skipMacroValidation -skipPackagePluginValidation \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

          APP="$ARCHIVE/Products/Applications/Punktfunk.app"
          ENTITLEMENTS="$RUNNER_TEMP/Punktfunk-test.entitlements"
          cp clients/apple/Config/Punktfunk-macOS.entitlements "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Delete :keychain-access-groups' "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.application-groups' "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Add :PunktfunkUseAppLocalDefaults bool true' "$APP/Contents/Info.plist"
          codesign --force --deep --timestamp=none --sign - \
            --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Punktfunk.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="$RUNNER_TEMP/Punktfunk-macOS-test-${GITHUB_SHA::7}.dmg"
          hdiutil create -volname 'Punktfunk Test' -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          mkdir -p artifacts
          cp "$DMG" artifacts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punktfunk-macos-${{ github.sha }}
          path: artifacts/*.dmg
          if-no-files-found: error

  omarchy:
    name: Omarchy packages
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git nodejs rust clang cmake ninja nasm pkgconf python vulkan-headers \
            gtk4 libadwaita sdl3 pipewire wayland libxkbcommon opus libei \
            mesa libglvnd sudo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Arch packages
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          VERSION="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          useradd -m builder
          mkdir -p dist
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder env \
            PF_SRCDIR="$GITHUB_WORKSPACE" \
            PF_PKGVER="${VERSION}.test${GITHUB_RUN_NUMBER}" \
            PF_PKGREL=1 \
            PKGDEST="$GITHUB_WORKSPACE/dist" \
            makepkg -f -d --holdver

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punktfunk-omarchy-${{ github.sha }}
          path: |
            dist/punktfunk-host-*.pkg.tar.zst
            dist/punktfunk-icons-*.pkg.tar.zst
          if-no-files-found: error
