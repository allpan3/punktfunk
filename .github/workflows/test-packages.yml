name: Test packages

# Package version = the upstream version in Cargo.toml + "." + HOTFIX, release = this
# workflow's run number: 0.40.0.1-17. Bump HOTFIX by hand when the fix set changes; the run
# number makes every build an upgrade regardless. pacman and dpkg rank 0.40.0.1 above the
# official 0.40.0-1 and its rebuilds, and below the next upstream 0.41.0. Digits only: an
# alphabetic suffix such as ".test17" sorts BELOW 0.40.0 in pacman. Reset HOTFIX to 1 at a
# new upstream version. Every file name carries version and release.

on:
  workflow_dispatch:
  push:
    branches: [build/test-packages]

permissions:
  contents: read

env:
  HOTFIX: 1

concurrency:
  group: test-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the Rust xcframework
        run: bash scripts/build-xcframework.sh

      - name: Archive and package the app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          VERSION="${VERSION}.${HOTFIX}"
          PKG_VERSION="${VERSION}-${GITHUB_RUN_NUMBER}"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          ARCHIVE="$RUNNER_TEMP/Punktfunk-macos.xcarchive"
          DERIVED="$RUNNER_TEMP/DerivedData"

          xcodebuild archive \
            -project clients/apple/Punktfunk.xcodeproj \
            -scheme Punktfunk \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            -skipMacroValidation -skipPackagePluginValidation \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

          APP="$ARCHIVE/Products/Applications/Punktfunk.app"
          ENTITLEMENTS="$RUNNER_TEMP/Punktfunk-test.entitlements"
          cp clients/apple/Config/Punktfunk-macOS.entitlements "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Delete :keychain-access-groups' "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.application-groups' "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Add :PunktfunkUseAppLocalDefaults bool true' "$APP/Contents/Info.plist"
          codesign --force --deep --timestamp=none --sign - \
            --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Punktfunk.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="$RUNNER_TEMP/Punktfunk-${PKG_VERSION}-macos.dmg"
          hdiutil create -volname "Punktfunk ${PKG_VERSION}" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          mkdir -p artifacts
          cp "$DMG" artifacts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punktfunk-${{ env.PKG_VERSION }}-macos
          path: artifacts/*.dmg
          if-no-files-found: error

  omarchy:
    name: Omarchy packages
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git nodejs rust clang cmake ninja nasm pkgconf python vulkan-headers \
            gtk4 libadwaita sdl3 pipewire wayland libxkbcommon opus libei \
            mesa libglvnd sudo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Arch packages
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          VERSION="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          VERSION="${VERSION}.${HOTFIX}"
          PKG_VERSION="${VERSION}-${GITHUB_RUN_NUMBER}"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          useradd -m builder
          mkdir -p dist
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder env \
            PF_SRCDIR="$GITHUB_WORKSPACE" \
            PF_PKGVER="$VERSION" \
            PF_PKGREL="$GITHUB_RUN_NUMBER" \
            PKGDEST="$GITHUB_WORKSPACE/dist" \
            makepkg -f -d --holdver

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: punktfunk-${{ env.PKG_VERSION }}-omarchy
          path: |
            dist/punktfunk-host-*.pkg.tar.zst
            dist/punktfunk-icons-*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: [macos, omarchy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish the packages as a prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          PKG_VERSION="${VERSION}.${HOTFIX}-${GITHUB_RUN_NUMBER}"
          gh run download "$GITHUB_RUN_ID" -D dist
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Test build ${PKG_VERSION} of \`build/test-packages\` at ${GITHUB_SHA::9}."
            echo
            echo "Assembled from:"
            git log --first-parent --format='- %s' "v${VERSION}..HEAD"
            echo
            echo "Arch host:"
            echo '```'
            echo "sudo pacman -U punktfunk-host-${PKG_VERSION}-x86_64.pkg.tar.zst punktfunk-icons-${PKG_VERSION}-x86_64.pkg.tar.zst"
            echo "systemctl --user restart punktfunk-host"
            echo '```'
            echo "The package does not restart the running host. Restart the user service after the install, or the old build keeps streaming."
            echo
            echo "macOS: open the DMG, drag Punktfunk into Applications replacing the old copy, then clear the Gatekeeper block and relaunch:"
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/Punktfunk.app"
            echo '```'
            echo "The build is ad-hoc signed, not notarized, so without this macOS refuses the first launch until you allow it in Privacy & Security. Microphone and input permissions may ask again after an update."
          } > "$NOTES"
          gh release create "test-${PKG_VERSION}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Test packages ${PKG_VERSION}" --notes-file "$NOTES" \
            dist/*/*.dmg dist/*/*.pkg.tar.zst
