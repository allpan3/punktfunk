[package]
name = "punktfunk-seats"
description = "Windows multi-seat supervisor and local control service"
version = "0.34.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["unom"]
repository = "https://git.unom.io/unom/punktfunk"
publish = false

[[bin]]
name = "punktfunk-seats"
path = "src/main.rs"

[dependencies]
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
hex = "0.4"
pf-paths = { path = "../pf-paths" }
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
ironrdp = { version = "=0.16.0", default-features = false, features = ["connector", "graphics", "session"] }
ironrdp-blocking = "=0.9.0"
windows-service = "0.8"
winreg = "0.56"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
resolver = "2"
